          image: registry.example/resource-embedding@sha256:replace-me
          env:
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: resource-embedding-secrets
                  key: service-token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
