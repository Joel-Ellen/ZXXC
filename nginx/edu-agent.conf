# ============================================================================
# EduAgent Nginx 反向代理配置
# ============================================================================
# 使用方式 (二选一):
#
#   方案 A — 独立域名 (如 edu.your-domain.com):
#     将此文件复制到 /etc/nginx/sites-available/edu-agent
#     然后 ln -s /etc/nginx/sites-available/edu-agent /etc/nginx/sites-enabled/
#     nginx -t && nginx -s reload
#
#   方案 B — 路径前缀 (如 your-domain.com/edu/):
#     复制 server 块里的 location 段落到你现有的 server {} 中
#     前端需要调整 base path (见下方说明)
# ============================================================================

