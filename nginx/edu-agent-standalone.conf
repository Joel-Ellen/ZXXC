# Standalone reverse proxy for local verification or a secondary listener.
# The application remains bound to 127.0.0.1:8800; Nginx listens on 8080.

upstream eduagent_standalone_backend {
    server 127.0.0.1:8800;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;

    # Canonical Tutor endpoint. Streaming is selected by Accept or request body.
    location ~ ^/api/sessions/[^/]+/tutor(?:-stream)?$ {
        proxy_pass http://eduagent_standalone_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-EduAgent-Stream-ID $http_x_eduagent_stream_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
        add_header X-Accel-Buffering "no" always;
    }

    # Reconnectable resource-generation event stream.
    location ~ ^/api/resource-generation-jobs/[^/]+/events$ {
        proxy_pass http://eduagent_standalone_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
        add_header X-Accel-Buffering "no" always;
    }

    location /api/ {
        proxy_pass http://eduagent_standalone_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://eduagent_standalone_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
