# ============================================================================
# EduAgent Docker Compose — 完整服务编排
# ============================================================================
# 使用方式:
#   1. 复制 .env.example 为 .env 并填写真实的 API Key 和密码
#   2. docker compose up -d              # 启动所有服务
#   3. docker compose logs -f app        # 查看应用日志
#   4. docker compose down               # 停止所有服务
#
# 注意:
#   - 如果服务器上已有 Neo4j / ES / Milvus 等服务，可注释掉对应段落
#   - 所有数据库端口绑定到 127.0.0.1，仅允许本地访问，由 Nginx 代理对外
# ============================================================================

services:
  # =========================================================================
  # 主应用 — EduAgent 后端
  # =========================================================================
  app:
    build:
      context: .
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.05}
    container_name: edu-agent-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8800:8800"          # 仅本地访问，由宿主机 Nginx 代理
    environment:
      - APP_ENV=production
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - EDUAGENT_OPS_TOKEN=${EDUAGENT_OPS_TOKEN:?EDUAGENT_OPS_TOKEN is required}
      - EDUAGENT_CODE_PRACTICE_ROLLOUT_PERCENT=${EDUAGENT_CODE_PRACTICE_ROLLOUT_PERCENT:-0}
      - EDUAGENT_CODE_PRACTICE_ROLLOUT_ALLOWLIST=${EDUAGENT_CODE_PRACTICE_ROLLOUT_ALLOWLIST:-}
      - EDUAGENT_CODE_PRACTICE_ROLLOUT_DENYLIST=${EDUAGENT_CODE_PRACTICE_ROLLOUT_DENYLIST:-}
      - EDUAGENT_ENABLE_COMPAT_API=false
      - EDUAGENT_ENABLE_PUBLIC_METRICS=false
      # ── LLM API Keys ──
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - SPARK_API_KEY=${SPARK_API_KEY:-}
      - SPARK_APP_ID=${SPARK_APP_ID:-}
      - SPARK_API_SECRET=${SPARK_API_SECRET:-}
      - EDUAGENT_LLM_FALLBACKS=${EDUAGENT_LLM_FALLBACKS:-}
      - EDUAGENT_RESOURCE_LLM_TIMEOUT_SEC=${EDUAGENT_RESOURCE_LLM_TIMEOUT_SEC:-50}
      - EDUAGENT_RESOURCE_LLM_TOTAL_TIMEOUT_SEC=${EDUAGENT_RESOURCE_LLM_TOTAL_TIMEOUT_SEC:-55}
      - EDUAGENT_RESOURCE_LLM_RETRIES=${EDUAGENT_RESOURCE_LLM_RETRIES:-1}
      - EDUAGENT_RESOURCE_LLM_PARALLELISM=${EDUAGENT_RESOURCE_LLM_PARALLELISM:-3}
      # ── 数据库连接 ──
      - DATABASE_URL=postgresql://eduagent:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/eduagent
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-EduAgent2024!}
      - ES_HOST=http://elasticsearch:9200
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      # ── HuggingFace 镜像 ──
      - HF_ENDPOINT=https://hf-mirror.com
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SSL=${SMTP_SSL:-1}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    networks:
      - edu-agent-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=eduagent
      - POSTGRES_USER=eduagent
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduagent -d eduagent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edu-agent-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edu-agent-net

  # =========================================================================
  # Neo4j — 图数据库（知识图谱）
  # =========================================================================
  neo4j:
    image: neo4j:5.20-community
    container_name: edu-agent-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"          # HTTP (仅本地)
      - "127.0.0.1:7687:7687"          # Bolt (仅本地)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-EduAgent2024!}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=128m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-EduAgent2024!}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edu-agent-net

  # =========================================================================
  # Elasticsearch — 全文搜索 + 向量检索
  # =========================================================================
  elasticsearch:
    image: elasticsearch:8.17.4
    container_name: edu-agent-es
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"          # HTTP (仅本地)
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false    # 内网部署，关闭安全认证
      - "ES_JAVA_OPTS=-Xms256m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - edu-agent-net

  # =========================================================================
  # etcd — Milvus 元数据存储
  # =========================================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: edu-agent-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - edu-agent-net

  # =========================================================================
  # MinIO — Milvus 对象存储
  # =========================================================================
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: edu-agent-minio
    restart: unless-stopped
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin2024}
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - edu-agent-net

  # =========================================================================
  # Milvus — 向量数据库
  # =========================================================================
  milvus-standalone:
    image: milvusdb/milvus:v2.3.19
    container_name: edu-agent-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin2024}
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - edu-agent-net

# ============================================================================
# 命名卷
# ============================================================================
volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  es-data:
  etcd-data:
  minio-data:
  milvus-data:

# ============================================================================
# 网络
# ============================================================================
networks:
  edu-agent-net:
    driver: bridge
    name: edu-agent-net
