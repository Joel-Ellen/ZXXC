name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  core:
    name: Core Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DASHSCOPE_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      EDUAGENT_LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python suite
        run: python -m pytest tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend unit and component tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

  browser:
    name: Browser Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/output/playwright/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
